<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0B1020"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#38BDF8" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0B1020" stop-opacity="0"/>
    </radialGradient>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="400" rx="36" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  
  <!-- Ambient Center Glow -->
  <circle cx="200" cy="200" r="160" fill="url(#centerGlow)"/>

  <!-- Tech Grid Lines / Data Nodes -->
  <g opacity="0.3" stroke="#38BDF8" stroke-width="1" stroke-dasharray="4,6">
    <circle cx="200" cy="200" r="140" fill="none"/>
    <circle cx="200" cy="200" r="105" fill="none"/>
    <line x1="60" y1="200" x2="340" y2="200"/>
    <line x1="200" y1="60" x2="200" y2="340"/>
  </g>

  <!-- Orbital Particles -->
  <circle cx="95" cy="200" r="4.5" fill="#38BDF8" filter="url(#glowEffect)"/>
  <circle cx="274" cy="126" r="4" fill="#8B5CF6" filter="url(#glowEffect)"/>
  <circle cx="126" cy="274" r="5" fill="#38BDF8" filter="url(#glowEffect)"/>
  <circle cx="200" cy="95" r="4" fill="#A78BFA" filter="url(#glowEffect)"/>

  <!-- Inner Badge Container -->
  <circle cx="200" cy="180" r="68" fill="#111827" stroke="url(#primaryGrad)" stroke-width="3" filter="url(#glowEffect)"/>
  
  <!-- Monogram Initials DS -->
  <text x="200" y="196" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="800" font-size="52" fill="url(#primaryGrad)" text-anchor="middle" letter-spacing="-1">DS</text>

  <!-- Label Subtext -->
  <text x="200" y="290" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="700" font-size="18" fill="#F8FAFC" text-anchor="middle" letter-spacing="0.5">DINITHI SAMARATHUNGA</text>
  <text x="200" y="315" font-family="'JetBrains Mono', monospace" font-weight="500" font-size="13" fill="#38BDF8" text-anchor="middle" letter-spacing="1">DATA SCIENCE • AI / ML</text>
</svg>
